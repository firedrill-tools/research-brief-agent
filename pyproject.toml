[project]
name = "research-brief-agent"
version = "0.1.0"
description = "Source-aware research briefs with LlamaIndex and Gemini"
requires-python = ">=3.12"
dependencies = ["llama-index-core>=0.14,<0.16", "llama-index-llms-google-genai>=0.11,<0.13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
research-brief = "research_brief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
